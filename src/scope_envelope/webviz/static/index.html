<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ScopeEnvelope — live viz</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/force-graph"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<header>
  <h1>ScopeEnvelope</h1>
  <div class="legend">
    <span class="legend-item"><i class="dot read"></i>read</span>
    <span class="legend-item"><i class="dot written"></i>written</span>
    <span class="legend-item"><i class="dot blocked"></i>blocked</span>
    <span class="legend-item"><i class="dot in-scope"></i>in scope (dashed border)</span>
    <span class="legend-item"><i class="dot current"></i>agent is here</span>
  </div>
</header>

<main class="panels">
  <section class="panel" data-condition="lazy">
    <div class="panel-head">
      <h2>lazy</h2>
      <span class="status" id="status-lazy">running</span>
    </div>
    <div class="graph" id="graph-lazy"></div>
    <div class="counters">
      <div><span class="label">tool calls</span><span class="value" id="calls-lazy">0</span></div>
      <div><span class="label">files read</span><span class="value" id="reads-lazy">0</span></div>
      <div><span class="label">prompt tokens</span><span class="value" id="tokens-lazy">--</span></div>
      <div><span class="label">cost</span><span class="value" id="cost-lazy">--</span></div>
    </div>
  </section>

  <section class="panel" data-condition="envelope">
    <div class="panel-head">
      <h2>envelope</h2>
      <span class="status" id="status-envelope">running</span>
    </div>
    <div class="graph" id="graph-envelope"></div>
    <div class="counters">
      <div><span class="label">tool calls</span><span class="value" id="calls-envelope">0</span></div>
      <div><span class="label">files read</span><span class="value" id="reads-envelope">0</span></div>
      <div><span class="label">prompt tokens</span><span class="value" id="tokens-envelope">--</span></div>
      <div><span class="label">cost</span><span class="value" id="cost-envelope">--</span></div>
    </div>
  </section>
</main>

<footer class="trend">
  <div class="trend-head">
    <h2>trend</h2>
    <label><input type="radio" name="metric" value="tokens" checked> prompt tokens (cumulative)</label>
    <label><input type="radio" name="metric" value="cost"> cost $ (cumulative)</label>
  </div>
  <canvas id="trend-chart" height="90"></canvas>
</footer>

<script src="app.js"></script>
</body>
</html>
